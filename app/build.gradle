
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.v2rayapp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.v2rayapp'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

repositories {
    flatDir {
        dirs '.'
    }
}

dependencies {
    implementation(name: 'libbox', ext: 'aar')
}
